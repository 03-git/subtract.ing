<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sight words</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
.trial{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1.5rem}
.icon{font-size:6rem}
.word{font-size:2.5rem;font-weight:bold}
.prompt{font-size:1.4rem;color:#ff6}
.answer-box input{font:1.2rem monospace;padding:.6rem 1rem;background:#111;color:#fff;border:2px solid #555;border-radius:6px;width:20rem;text-align:center;outline:none}
.answer-box input:focus{border-color:#fff}
.reveal{font-size:1.4rem;margin-top:1rem}
.judge{display:flex;gap:2rem;margin-top:1rem}
.judge button{font:bold 1.5rem monospace;padding:.8rem 2.5rem;border:3px solid #555;background:#111;color:#fff;cursor:pointer;border-radius:8px}
.judge button:hover{border-color:#fff}
.feedback{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:8rem;font-weight:bold;z-index:10}
.feedback.correct{background:#4c4;color:#fff}
.feedback.incorrect{background:#c44;color:#fff}
.summary{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1.5rem}
.summary .score{font-size:3rem;font-weight:bold}
.summary .correct{color:#4c4}
.summary .incorrect{color:#c44}
.summary .total{font-size:1.5rem;opacity:.7}
.summary button{font:bold 1.2rem monospace;padding:.8rem 2rem;border:2px solid #555;background:#111;color:#fff;cursor:pointer;border-radius:6px;margin-top:1rem}
.summary button:hover{border-color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="trial hidden" id="trial">
  <div class="icon" id="icon"></div>
  <div class="word" id="word"></div>
  <div class="prompt">what does it mean?</div>
  <div class="answer-box"><input id="resp" autocomplete="off" autofocus></div>
  <div class="reveal hidden" id="reveal"></div>
  <div class="judge hidden" id="judge">
    <button onclick="judge(true)">correct</button>
    <button onclick="judge(false)">incorrect</button>
  </div>
</div>
<div class="feedback hidden" id="feedback"></div>
<div class="summary hidden" id="summary">
  <div>session complete</div>
  <div class="score correct" id="scoreCorrect"></div>
  <div class="score incorrect" id="scoreIncorrect"></div>
  <div class="total" id="scoreTotal"></div>
  <button onclick="location='multiplying.html'">back</button>
  <button onclick="location.reload()">again</button>
</div>
<script>
var data=[],order=[],idx=0,correct=0,incorrect=0,log=[],userResp='';

fetch('clinical/sight-words-spanish.json').then(function(r){return r.json()}).then(function(d){
  data=d;
  order=Array.from({length:d.length},function(_,i){return i});
  for(var i=order.length-1;i>0;i--){var j=Math.random()*i|0;var t=order[i];order[i]=order[j];order[j]=t;}
  showTrial();
});

function showTrial(){
  if(idx>=order.length){showSummary();return;}
  var item=data[order[idx]];
  document.getElementById('icon').textContent=item.icon;
  document.getElementById('word').textContent=item.es;
  document.getElementById('trial').classList.remove('hidden');
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('reveal').classList.add('hidden');
  document.getElementById('judge').classList.add('hidden');
  var inp=document.getElementById('resp');inp.value='';inp.focus();
  if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(item.es);u.lang='es';speechSynthesis.speak(u);}
}

document.getElementById('resp').addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    userResp=this.value;
    var item=data[order[idx]];
    document.getElementById('reveal').textContent='→ '+item.en;
    document.getElementById('reveal').classList.remove('hidden');
    document.getElementById('judge').classList.remove('hidden');
  }
});

function judge(isCorrect){
  var item=data[order[idx]];
  var fb=document.getElementById('feedback');
  fb.className='feedback '+(isCorrect?'correct':'incorrect');
  fb.textContent=isCorrect?'✓':'✗';
  fb.classList.remove('hidden');
  if(isCorrect)correct++;else incorrect++;
  log.push({time:new Date().toISOString(),program:'sight-words-spanish',stimulus:item.es,response:userResp,expected:item.en,result:isCorrect?'correct':'incorrect'});
  idx++;
  setTimeout(showTrial,2000);
}

function showSummary(){
  document.getElementById('trial').classList.add('hidden');
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('scoreCorrect').textContent='✓ '+correct;
  document.getElementById('scoreIncorrect').textContent='✗ '+incorrect;
  document.getElementById('scoreTotal').textContent='total: '+(correct+incorrect);
  document.getElementById('summary').classList.remove('hidden');
  try{fetch('log',{method:'POST',headers:{'Content-Type':'text/plain'},body:log.map(function(e){return JSON.stringify(e)}).join('\n')+'\n'}).catch(function(){});}catch(e){}
}
document.addEventListener("keydown",function(e){if(e.key==="F5"||(e.ctrlKey&&e.key==="r")){e.preventDefault();location.reload();}if(e.key==="Escape"){location.href="multiplying.html";}});
</script>
</body>
</html>
